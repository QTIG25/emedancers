<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EME Dancers Backstage Command Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Global Emergency Banner Override -->
    <div id="emergency-banner" class="hidden bg-red-600 text-white font-black text-center py-4 px-6 text-2xl animate-pulse z-50"></div>

    <!-- Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('home')">
            <span class="font-black text-lg tracking-wide text-indigo-400">⚡ EME DANCERS BACKSTAGE</span>
        </div>
        <nav class="flex items-center gap-2 overflow-x-auto">
            <button onclick="switchView('home')" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 font-medium">Home</button>
            <button onclick="switchView('pos')" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 font-medium">POS</button>
            <button onclick="switchView('kds')" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 font-medium">KDS</button>
            <button onclick="switchView('dj')" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 font-medium">DJ Deck</button>
            <button onclick="switchView('ann')" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 font-medium">Big Screen</button>
            <button onclick="switchView('admin')" class="px-3 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 font-medium">Admin</button>
        </nav>
    </header>

    <!-- Main Dynamic Views Container -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full" id="app-container">
        <!-- Views load here dynamically -->
    </main>

</body>
</html>
