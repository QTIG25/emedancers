<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EME Dancers | Backstage Command System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-brand { font-family: 'Outfit', sans-serif; }
        @keyframes strobe-bg {
            0%, 100% { background-color: #7f1d1d; }
            50% { background-color: #000000; }
        }
        .bs-emergency-active {
            animation: strobe-bg 1s infinite steps(1);
        }
        @keyframes float-streamer {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .confetti-streamer {
            white-space: nowrap;
            font-size: 3.5rem;
            animation: float-streamer 7s linear infinite;
            position: absolute;
            top: 18%;
            opacity: 0.85;
        }
    </style>
    <script defer src="app.js"></script>
</head>
<body class="bg-[#0b0e14] text-slate-100 min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">

    <!-- Global Emergency Alert Visual Overlay -->
    <div id="kiosk-emergency-overlay" class="hidden fixed inset-0 z-50 bs-emergency-active text-white p-8 flex flex-col items-center justify-center text-center">
        <div class="border-8 border-yellow-400 p-8 md:p-16 rounded-3xl max-w-5xl bg-black/90 backdrop-blur-md shadow-2xl space-y-6">
            <p class="text-yellow-400 font-bold tracking-widest text-lg md:text-2xl uppercase">EMERGENCY NOTIFICATION</p>
            <h1 class="text-5xl md:text-8xl font-black tracking-tight text-red-500 underline">EVACUATE PREMISES</h1>
            <p class="text-2xl md:text-4xl font-bold tracking-wide text-white" id="kiosk-emergency-msg">PLEASE LEAVE THE PREMISES IMMEDIATELY VIA THE NEAREST FIRE EXIT</p>
        </div>
    </div>

    <!-- Navigation Header -->
    <header id="main-header" class="bg-[#121721] border-b border-slate-800/80 px-6 py-3.5 sticky top-0 z-40 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('home')">
            <div class="bg-indigo-600 text-white font-black text-xs px-2.5 py-1.5 rounded tracking-wider">EME</div>
            <div>
                <span class="font-bold text-sm md:text-base tracking-wide text-white block leading-none">EME DANCERS</span>
                <span class="text-[10px] uppercase font-semibold tracking-widest text-slate-400">Backstage Management</span>
            </div>
        </div>
        
        <nav class="flex items-center gap-1.5 overflow-x-auto">
            <button onclick="switchView('home')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 transition border border-slate-700/50">Home</button>
            <button onclick="switchView('pos')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 transition border border-slate-700/50">POS</button>
            <button onclick="switchView('kds')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 transition border border-slate-700/50">KDS</button>
            <button onclick="switchView('dj')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 transition border border-slate-700/50">DJ & Tech</button>
            <button onclick="switchView('ann')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition">Big Screen (ANN/CDS)</button>
            <button onclick="switchView('admin')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 transition border border-slate-700/50">Admin</button>
        </nav>
    </header>

    <!-- Main Dynamic Views Container -->
    <main class="flex-1 w-full" id="app-container">
        <!-- Views load here dynamically -->
    </main>

    <!-- Navigation Footer -->
    <footer id="main-footer" class="py-3 px-6 text-center text-[11px] text-slate-500 border-t border-slate-900 bg-[#0d1017]">
        EME Dancers Production System • Live Cloud Synchronized
    </footer>

</body>
</html>
